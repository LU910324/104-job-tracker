name: 檢查104新職缺並通知Discord

on:
  # 注意：排程（schedule）已經停用！
  # 實測發現 104 人力銀行的 Cloudflare 防護機制，幾乎必定會擋下 GitHub Actions
  # 這類「機房 IP」（公司頁面直接跳出人機驗證頁面、關鍵字搜尋回傳0筆），
  # 跟程式碼寫得好不好無關。改成用 scripts/run.sh + launchd 在自己電腦上執行，
  # 見 README「在自己電腦上排程執行」章節。這裡保留 workflow_dispatch
  # 只是方便之後想手動測試/除錯時使用。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安裝套件
        run: npm ci

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 執行職缺檢查
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      - name: 提交更新後的職缺資料
        run: |
          git config user.name "104-job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/jobs.json; then
            git add data/jobs.json
            git commit -m "更新職缺資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "資料沒有變化，不需要提交"
          fi
